name: Build APK

# 手动触发：在 GitHub 仓库的 Actions 页面点 "Build APK" -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/keystore.jks \
            -alias geometry \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass geometry123 -keypass geometry123 \
            -dname "CN=GeometryDuel, OU=Dev, O=GeometryDuel, L=Xiamen, ST=Fujian, C=CN"

      - name: Build release APK
        env:
          KEYSTORE: android/keystore.jks
          KS_PASS: geometry123
          KEY_ALIAS: geometry
          KEY_PASS: geometry123
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry-duel-apk
          path: android/app/build/outputs/apk/release/*.apk
